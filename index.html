<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки для Кариночки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .card-container {
            perspective: 1500px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 300px;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-size: 1.8em;
            font-weight: bold;
            word-break: break-word;
        }

        .card-front {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 5px solid rgba(255,255,255,0.3);
        }

        .card-back {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            transform: rotateY(180deg);
            border: 5px solid rgba(255,255,255,0.3);
        }

        .stats {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .stat-box {
            flex: 1;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .mode-badge {
            background: rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin: 15px 0;
            display: inline-block;
            color: white;
            border: 2px solid white;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #2c3e50;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.shuffle {
            background: #9b59b6;
            color: white;
        }

        .btn.mode {
            background: #e67e22;
            color: white;
        }

        .progress-container {
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            margin: 30px 0 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            width: 0%;
            transition: width 0.5s ease;
        }

        .hint {
            color: rgba(255,255,255,0.9);
            font-size: 1.1em;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .hint i {
            font-style: normal;
            margin-right: 10px;
        }

        footer {
            color: rgba(255,255,255,0.8);
            margin-top: 30px;
            font-size: 0.9em;
        }

        footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                height: 250px;
            }
            
            .card-front, .card-back {
                font-size: 1.4em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Карточки для Кариночки</h1>
        <p class="subtitle">Кликни на карточку, чтобы увидеть перевод ❤️</p>

        <div class="mode-badge" id="mode-display">
            🇷🇺 → 🇬🇧 Русский → Английский
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Карточка</div>
                <div class="stat-value" id="current">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Всего</div>
                <div class="stat-value" id="total">20</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-front" id="front">
                    загрузка...
                </div>
                <div class="card-back" id="back">
                    ...
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prevCard()">◀ Предыдущая</button>
            <button class="btn" onclick="nextCard()">Следующая ▶</button>
        </div>

        <div class="controls">
            <button class="btn shuffle" onclick="shuffleCards()">🔀 Перемешать</button>
            <button class="btn mode" onclick="switchMode()">
                <span id="mode-btn-text">🇷🇺→🇬🇧 RU→EN</span>
            </button>
        </div>

        <div class="hint">
            <i>💡</i> Кликни по карточке — она перевернётся! Сейчас <span id="hint-mode">русское слово</span> спереди, перевод сзади.
        </div>

        <footer>
            <p>Для Кариночки с любовью ❤️ • <a href="https://github.com/scroll94/kapurina" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script>
        // 20 слов
        const words = [
            { en: "sleep rough", ru: "спать на улице" },
            { en: "grubby", ru: "грязный" },
            { en: "relucant", ru: "неохотный" },
            { en: "foster home", ru: "приемная семья" },
            { en: "fixed address", ru: "постоянный адрес" },
            { en: "sleeping bag", ru: "спальный мешок" },
            { en: "shiver", ru: "дрожать" },
            { en: "temporary", ru: "временный" },
            { en: "accommodation", ru: "жилье" },
            { en: "abandoned", ru: "заброшенный" },
            { en: "warehouse", ru: "склад" },
            { en: "cramped", ru: "тесный" },
            { en: "drug addict", ru: "наркоман" },
            { en: "traffic fumes", ru: "выхлопные газы" },
            { en: "deafening", ru: "оглушительный" },
            { en: "choke", ru: "задыхаться" },
            { en: "begging", ru: "попрошайничество" },
            { en: "suburbs", ru: "пригороды" },
            { en: "dignity", ru: "достоинство" },
            { en: "vicious circle", ru: "замкнутый круг" }
        ];

        // Состояние
        let currentIndex = 0;
        let mode = 'ru-en'; // 'ru-en' (русский вопрос) или 'en-ru' (английский вопрос)
        let isFlipped = false;
        let shuffledWords = [...words];

        // Элементы
        const card = document.getElementById('card');
        const front = document.getElementById('front');
        const back = document.getElementById('back');
        const currentEl = document.getElementById('current');
        const totalEl = document.getElementById('total');
        const modeDisplay = document.getElementById('mode-display');
        const modeBtnText = document.getElementById('mode-btn-text');
        const hintMode = document.getElementById('hint-mode');
        const progressBar = document.getElementById('progress-bar');

        // Инициализация
        function init() {
            totalEl.textContent = words.length;
            shuffleCards();
        }

        // Показать текущую карточку
        function showCard() {
            const word = shuffledWords[currentIndex];
            
            if (mode === 'ru-en') {
                // Русский вопрос, английский ответ
                front.textContent = word.ru;
                back.textContent = word.en;
                modeDisplay.textContent = '🇷🇺 → 🇬🇧 Русский → Английский';
                modeBtnText.textContent = '🇬🇧→🇷🇺 EN→RU';
                hintMode.textContent = 'русское слово';
            } else {
                // Английский вопрос, русский ответ
                front.textContent = word.en;
                back.textContent = word.ru;
                modeDisplay.textContent = '🇬🇧 → 🇷🇺 Английский → Русский';
                modeBtnText.textContent = '🇷🇺→🇬🇧 RU→EN';
                hintMode.textContent = 'английское слово';
            }

            // Если карточка перевёрнута, показываем ответ
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }

            // Обновляем счётчик
            currentEl.textContent = currentIndex + 1;
            
            // Обновляем прогресс
            const progress = ((currentIndex + 1) / shuffledWords.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // Перевернуть карточку
        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }
        }

        // Предыдущая карточка
        function prevCard() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = shuffledWords.length - 1;
            }
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();
        }

        // Следующая карточка
        function nextCard() {
            currentIndex = (currentIndex + 1) % shuffledWords.length;
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();
        }

        // Перемешать
        function shuffleCards() {
            shuffledWords = [...words];
            for (let i = shuffledWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledWords[i], shuffledWords[j]] = [shuffledWords[j], shuffledWords[i]];
            }
            currentIndex = 0;
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();

            // Анимация
            const btn = event?.target;
            if (btn) {
                btn.textContent = '🔀 Перемешано!';
                setTimeout(() => {
                    btn.textContent = '🔀 Перемешать';
                }, 1000);
            }
        }

        // Сменить режим
        function switchMode() {
            // Меняем режим
            if (mode === 'ru-en') {
                mode = 'en-ru'; // было русский вопрос, стало английский вопрос
            } else {
                mode = 'ru-en'; // было английский вопрос, стало русский вопрос
            }
            
            // Обновляем карточку с новым режимом
            showCard();

            // Анимация кнопки
            const btn = event?.target;
            if (btn) {
                const originalText = mode === 'ru-en' ? '🇬🇧→🇷🇺 EN→RU' : '🇷🇺→🇬🇧 RU→EN';
                btn.querySelector('span').textContent = originalText;
            }
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
