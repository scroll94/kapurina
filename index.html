<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест английских слов для Кариночки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e9ecef;
        }
        
        .stat-label {
            display: block;
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        #score-value {
            color: #27ae60;
        }
        
        #mode-display {
            background: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1em;
        }
        
        .question-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #question {
            font-size: 2em;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .answer-btn {
            padding: 20px;
            border: 3px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 1.2em;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .answer-btn:hover {
            background: #f8f9fa;
            border-color: #aaa;
            transform: translateY(-2px);
        }
        
        .answer-btn.selected {
            border-color: #3498db;
            background: #ebf5fb;
        }
        
        .answer-btn.correct {
            border-color: #27ae60;
            background: #d5f4e6;
        }
        
        .answer-btn.wrong {
            border-color: #e74c3c;
            background: #fadbd8;
        }
        
        .answer-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        #check-btn {
            background: #27ae60;
            color: white;
        }
        
        #check-btn:hover:not(:disabled) {
            background: #219653;
            transform: translateY(-2px);
        }
        
        #next-btn {
            background: #3498db;
            color: white;
        }
        
        #next-btn:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        #shuffle-btn {
            background: #9b59b6;
            color: white;
        }
        
        #shuffle-btn:hover {
            background: #8e44ad;
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-box {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .result-default {
            background: #f8f9fa;
            color: #495057;
            border: 3px dashed #dee2e6;
        }
        
        .result-correct {
            background: #d4edda;
            color: #155724;
            border: 3px solid #c3e6cb;
        }
        
        .result-wrong {
            background: #f8d7da;
            color: #721c24;
            border: 3px solid #f5c6cb;
        }
        
        .completion-message {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #2c3e50;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin: 30px 0;
            border: 5px solid #ff9a9e;
        }
        
        .completion-title {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #e74c3c;
        }
        
        .completion-text {
            font-size: 1.5em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .progress-container {
            height: 12px;
            background: #ecf0f1;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid #eee;
            color: #7f8c8d;
            font-size: 0.9em;
        }
        
        footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .answers {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            #question {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Тест для Кариночки ❤️</h1>
        <p class="subtitle">20 новых слов. Направления чередуются. Нажми "Перемешать" для рандома.</p>
        
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Вопрос</span>
                <span class="stat-value" id="current">1</span>/<span id="total">20</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Правильно</span>
                <span class="stat-value" id="score-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Режим</span>
                <div id="mode-display">EN → RU</div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="question-box">
            <div id="question">Загрузка...</div>
        </div>
        
        <div class="answers" id="answers-container">
            <!-- Ответы будут здесь -->
        </div>
        
        <div class="result-box result-default" id="result">
            Выберите вариант ответа
        </div>
        
        <div class="controls">
            <button id="check-btn">✅ Проверить</button>
            <button id="next-btn" disabled>➡️ Дальше</button>
            <button id="shuffle-btn">🔀 Перемешать</button>
        </div>
        
        <div id="completion-section" style="display: none;">
            <!-- Сюда будет вставляться сообщение о завершении -->
        </div>
        
        <footer>
            <p>Слова для изучения • <a href="https://github.com/scroll94/kapurina" target="_blank">GitHub</a> • Для Кариночки 💖</p>
        </footer>
    </div>

    <script>
        // 20 новых слов
        const words = [
            { en: "sleep rough", ru: "спать на улице" },
            { en: "grubby", ru: "грязный" },
            { en: "relucant", ru: "неохотный" },
            { en: "foster home", ru: "приемная семья" },
            { en: "fixed address", ru: "постоянный адрес" },
            { en: "sleeping bag", ru: "спальный мешок" },
            { en: "shiver", ru: "дрожать" },
            { en: "temporary", ru: "временный" },
            { en: "accommodation", ru: "жилье" },
            { en: "abandoned", ru: "заброшенный" },
            { en: "warehouse", ru: "склад" },
            { en: "cramped", ru: "тесный" },
            { en: "drug addict", ru: "наркоман" },
            { en: "traffic fumes", ru: "выхлопные газы" },
            { en: "deafening", ru: "оглушительный" },
            { en: "choke", ru: "задыхаться" },
            { en: "begging", ru: "попрошайничество" },
            { en: "suburbs", ru: "пригороды" },
            { en: "dignity", ru: "достоинство" },
            { en: "vicious circle", ru: "замкнутый круг" }
        ];

        // Переменные
        let currentIndex = 0;
        let score = 0;
        let selectedAnswer = null;
        let isAnswered = false;
        let shuffledWords = [...words];
        
        // DOM элементы
        const questionEl = document.getElementById('question');
        const answersContainer = document.getElementById('answers-container');
        const resultEl = document.getElementById('result');
        const currentEl = document.getElementById('current');
        const scoreEl = document.getElementById('score-value');
        const totalEl = document.getElementById('total');
        const modeDisplay = document.getElementById('mode-display');
        const progressBar = document.getElementById('progress-bar');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const completionSection = document.getElementById('completion-section');
        
        // Инициализация
        function init() {
            totalEl.textContent = words.length;
            shuffleWords();
            loadQuestion();
            
            checkBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', nextQuestion);
            shuffleBtn.addEventListener('click', shuffleWords);
        }
        
        // Загрузка вопроса
        function loadQuestion() {
            const word = shuffledWords[currentIndex];
            
            // Чередуем направления
            const mode = currentIndex % 2 === 0 ? 'en-ru' : 'ru-en';
            questionEl.textContent = mode === 'en-ru' ? word.en : word.ru;
            modeDisplay.textContent = mode === 'en-ru' ? 'EN → RU' : 'RU → EN';
            
            // Генерируем ответы
            generateAnswers(word, mode);
            
            // Сброс
            selectedAnswer = null;
            isAnswered = false;
            resultEl.textContent = 'Выберите вариант ответа';
            resultEl.className = 'result-box result-default';
            checkBtn.disabled = false;
            nextBtn.disabled = true;
            
            currentEl.textContent = currentIndex + 1;
            updateProgressBar();
        }
        
        // Генерация ответов
        function generateAnswers(correctWord, mode) {
            answersContainer.innerHTML = '';
            
            const correctAnswer = mode === 'en-ru' ? correctWord.ru : correctWord.en;
            
            // Неправильные ответы
            let wrongAnswers = [];
            const otherWords = shuffledWords.filter(w => w !== correctWord);
            
            for (let i = 0; i < 3; i++) {
                if (otherWords[i]) {
                    wrongAnswers.push(mode === 'en-ru' ? otherWords[i].ru : otherWords[i].en);
                }
            }
            
            // Все ответы
            let allAnswers = [correctAnswer, ...wrongAnswers];
            allAnswers = shuffleArray(allAnswers);
            
            allAnswers.forEach(answer => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = answer;
                
                button.addEventListener('click', () => {
                    if (isAnswered) return;
                    
                    document.querySelectorAll('.answer-btn').forEach(btn => {
                        btn.classList.remove('selected');
                    });
                    
                    button.classList.add('selected');
                    selectedAnswer = answer;
                });
                
                answersContainer.appendChild(button);
            });
        }
        
        // Проверка ответа
        function checkAnswer() {
            if (!selectedAnswer || isAnswered) return;
            
            const word = shuffledWords[currentIndex];
            const mode = modeDisplay.textContent === 'EN → RU' ? 'en-ru' : 'ru-en';
            const correctAnswer = mode === 'en-ru' ? word.ru : word.en;
            const isCorrect = selectedAnswer === correctAnswer;
            
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.classList.add('disabled');
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selectedAnswer && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });
            
            if (isCorrect) {
                score++;
                scoreEl.textContent = score;
                resultEl.textContent = '✅ Верно! ❤️';
                resultEl.className = 'result-box result-correct';
            } else {
                resultEl.textContent = `❌ Неверно! Правильно: ${correctAnswer}`;
                resultEl.className = 'result-box result-wrong';
            }
            
            isAnswered = true;
            checkBtn.disabled = true;
            nextBtn.disabled = false;
            
            // Проверка завершения
            if (currentIndex === shuffledWords.length - 1 && isCorrect) {
                setTimeout(() => showCompletion(), 1000);
            }
        }
        
        // Следующий вопрос
        function nextQuestion() {
            if (currentIndex < shuffledWords.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showCompletion();
            }
        }
        
        // Завершение теста
        function showCompletion() {
            const percentage = Math.round((score / shuffledWords.length) * 100);
            
            completionSection.innerHTML = `
                <div class="completion-message">
                    <div class="completion-title">🎉 Умничка, Кариночка!</div>
                    <div class="completion-text">
                        <p>Ты выполнила задание! 🥳</p>
                        <p>Ты моя принцесса! 👑💖</p>
                        <p>Результат: <strong>${score} из ${shuffledWords.length}</strong> (${percentage}%)</p>
                        <p style="font-size: 1.8em; margin-top: 20px;">❤️❤️❤️</p>
                    </div>
                    <button onclick="restart()" style="margin-top: 20px; padding: 15px 30px; font-size: 1.2em; background: #27ae60; color: white; border: none; border-radius: 10px; cursor: pointer;">
                        🔄 Пройти ещё раз
                    </button>
                </div>
            `;
            
            completionSection.style.display = 'block';
            document.querySelector('.question-box').style.display = 'none';
            document.querySelector('.answers').style.display = 'none';
            document.querySelector('.result-box').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
        }
        
        // Перезапуск
        function restart() {
            completionSection.style.display = 'none';
            document.querySelector('.question-box').style.display = 'flex';
            document.querySelector('.answers').style.display = 'grid';
            document.querySelector('.result-box').style.display = 'flex';
            document.querySelector('.controls').style.display = 'flex';
            
            shuffleWords();
        }
        
        // Перемешать
        function shuffleWords() {
            shuffledWords = shuffleArray([...words]);
            currentIndex = 0;
            score = 0;
            scoreEl.textContent = score;
            loadQuestion();
            
            shuffleBtn.textContent = '🔀 Перемешано!';
            setTimeout(() => {
                shuffleBtn.textContent = '🔀 Перемешать';
            }, 1000);
        }
        
        // Прогресс-бар
        function updateProgressBar() {
            const progress = ((currentIndex + 1) / shuffledWords.length) * 100;
            progressBar.style.width = `${progress}%`;
        }
        
        // Перемешивание массива
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // Запуск
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
