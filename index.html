<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки для Кариночки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .mode-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50px;
            color: white;
            font-size: 1.2em;
            margin-bottom: 20px;
            border: 2px solid white;
        }

        .card-container {
            perspective: 1500px;
            margin: 20px 0;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 300px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
            color: white;
        }

        .card-front {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 5px solid rgba(255,255,255,0.3);
        }

        .card-back {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            transform: rotateY(180deg);
            border: 5px solid rgba(255,255,255,0.3);
        }

        .counter {
            color: white;
            font-size: 1.2em;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #2c3e50;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn.mode {
            background: #e67e22;
            color: white;
        }

        footer {
            color: rgba(255,255,255,0.8);
            margin-top: 30px;
        }

        @media (max-width: 500px) {
            .card {
                height: 250px;
            }
            
            .card-front, .card-back {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Карточки</h1>
        
        <div class="mode-badge" id="modeDisplay">🇷🇺 Русский → 🇬🇧 Английский</div>
        
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-front" id="front">спать на улице</div>
                <div class="card-back" id="back">sleep rough</div>
            </div>
        </div>
        
        <div class="counter" id="counter">1 / 20</div>
        
        <div class="controls">
            <button class="btn" onclick="prevCard()">◀ Назад</button>
            <button class="btn" onclick="nextCard()">Вперед ▶</button>
        </div>
        
        <div class="controls">
            <button class="btn mode" onclick="switchMode()" id="modeBtn">
                🔄 Поменять (RU→EN)
            </button>
        </div>
        
        <footer>
            ❤️ Для Кариночки
        </footer>
    </div>

    <script>
        const words = [
            { en: "sleep rough", ru: "спать на улице" },
            { en: "grubby", ru: "грязный" },
            { en: "relucant", ru: "неохотный" },
            { en: "foster home", ru: "приемная семья" },
            { en: "fixed address", ru: "постоянный адрес" },
            { en: "sleeping bag", ru: "спальный мешок" },
            { en: "shiver", ru: "дрожать" },
            { en: "temporary", ru: "временный" },
            { en: "accommodation", ru: "жилье" },
            { en: "abandoned", ru: "заброшенный" },
            { en: "warehouse", ru: "склад" },
            { en: "cramped", ru: "тесный" },
            { en: "drug addict", ru: "наркоман" },
            { en: "traffic fumes", ru: "выхлопные газы" },
            { en: "deafening", ru: "оглушительный" },
            { en: "choke", ru: "задыхаться" },
            { en: "begging", ru: "попрошайничество" },
            { en: "suburbs", ru: "пригороды" },
            { en: "dignity", ru: "достоинство" },
            { en: "vicious circle", ru: "замкнутый круг" }
        ];

        let index = 0;
        let mode = 'ru-en'; // ru-en (русский вопрос) или en-ru (английский вопрос)
        let isFlipped = false;
        let shuffled = [...words];

        const card = document.getElementById('card');
        const front = document.getElementById('front');
        const back = document.getElementById('back');
        const counter = document.getElementById('counter');
        const modeDisplay = document.getElementById('modeDisplay');
        const modeBtn = document.getElementById('modeBtn');

        function showCard() {
            const word = shuffled[index];
            
            if (mode === 'ru-en') {
                front.textContent = word.ru;
                back.textContent = word.en;
                modeDisplay.textContent = '🇷🇺 Русский → 🇬🇧 Английский';
                modeBtn.textContent = '🔄 Поменять (EN→RU)';
            } else {
                front.textContent = word.en;
                back.textContent = word.ru;
                modeDisplay.textContent = '🇬🇧 Английский → 🇷🇺 Русский';
                modeBtn.textContent = '🔄 Поменять (RU→EN)';
            }
            
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }
            
            counter.textContent = `${index + 1} / ${shuffled.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            card.classList.toggle('flipped');
        }

        function nextCard() {
            index = (index + 1) % shuffled.length;
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();
        }

        function prevCard() {
            index--;
            if (index < 0) index = shuffled.length - 1;
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();
        }

        function switchMode() {
            mode = mode === 'ru-en' ? 'en-ru' : 'ru-en';
            isFlipped = false;
            card.classList.remove('flipped');
            showCard();
        }

        // Перемешиваем при загрузке
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        showCard();
    </script>
</body>
</html>
